# Builds the server programs NexDB installs on Macs: every version in versions.txt, for Intel
# and Apple Silicon, all running on macOS 13 and newer. Starts only by hand.
# When everything chosen has built, the files are published as one GitHub release.

name: Build Mac servers

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Programs to build, comma separated"
        default: "redis,mailpit,node,postgres,php,apache,nginx,mysql"
      publish:
        description: "Publish the results as a release"
        type: boolean
        default: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        program: [redis, mailpit, node, postgres, php, apache, nginx, mysql]
        runner: [macos-15-intel, macos-15]
        # MySQL takes over 5 hours on Intel runners, so its Intel build compiles on Apple Silicon.
        exclude:
          - program: mysql
            runner: macos-15-intel
        include:
          - program: mysql
            runner: macos-15
            target: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - name: Wanted?
        id: want
        run: |
          case ",${{ inputs.programs }}," in
            *",${{ matrix.program }},"*) echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not selected; skipping." ;;
          esac

      - uses: actions/checkout@v4
        if: steps.want.outputs.yes == 'true'

      - name: Build tools
        if: steps.want.outputs.yes == 'true'
        run: |
          brew install cmake ninja bison pkg-config autoconf automake libtool
          if [ -n "${{ matrix.target }}" ]; then softwareupdate --install-rosetta --agree-to-license || true; fi

      - name: Build every version
        if: steps.want.outputs.yes == 'true'
        # static-php-cli asks GitHub's API for ready-made parts; anonymous calls hit the hourly limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          versions="$(tr -d '\r' < versions.txt | awk -v id='${{ matrix.program }}' '$1 == id { $1 = ""; print }')"
          failed=0
          for v in $versions; do
            echo "::group::${{ matrix.program }} $v"
            # Logs need a GitHub sign-in to read; the last lines of a failure become a public note.
            if ! bash scripts/build.sh ${{ matrix.program }} "$v" > "build-$v.log" 2>&1; then
              cat "build-$v.log"
              tail -40 "build-$v.log" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=${{ matrix.program }} '"$v"' failed::/'
              echo
              failed=1
            else
              tail -5 "build-$v.log"
            fi
            echo "::endgroup::"
          done
          exit $failed

      # Versions that built are kept even when another version of the same program failed.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.want.outputs.yes == 'true' }}
        with:
          name: ${{ matrix.program }}-${{ matrix.runner }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          if-no-files-found: warn
          path: |
            out/*.tar.xz
            out/*.tar.xz.sha256
            out/*.tar.xz.minos

  publish:
    needs: build
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls files
          tag="mac-servers-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" files/* --repo "${{ github.repository }}" \
            --title "Mac servers $(date -u +%Y-%m-%d)" \
            --notes "Built for macOS 13+ on Intel (x64) and Apple Silicon (arm64). Add to NexDB's catalog with: python scripts/macos-servers/catalog.py add <these files> https://github.com/${{ github.repository }}/releases/download/$tag"
