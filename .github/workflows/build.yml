# Builds the server programs NexDB installs on Macs: every version in versions.txt, for Intel
# and Apple Silicon, all running on macOS 12 and newer. Starts only by hand.
# When everything chosen has built, the files are published as one GitHub release.

name: Build Mac servers

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Programs to build, comma separated"
        default: "redis,mailpit,node,postgres,php,apache,nginx,mysql"
      publish:
        description: "Publish the results as a release"
        type: boolean
        default: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        program: [redis, mailpit, node, postgres, php, apache, nginx, mysql]
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - name: Wanted?
        id: want
        run: |
          case ",${{ inputs.programs }}," in
            *",${{ matrix.program }},"*) echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not selected; skipping." ;;
          esac

      - uses: actions/checkout@v4
        if: steps.want.outputs.yes == 'true'

      - name: Build tools
        if: steps.want.outputs.yes == 'true'
        run: brew install cmake ninja bison pkg-config autoconf automake libtool

      - name: Build every version
        if: steps.want.outputs.yes == 'true'
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          versions="$(tr -d '' < versions.txt | awk -v id='${{ matrix.program }}' '$1 == id { $1 = ""; print }')"
          for v in $versions; do
            echo "::group::${{ matrix.program }} $v"
            bash scripts/build.sh ${{ matrix.program }} "$v"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.yes == 'true'
        with:
          name: ${{ matrix.program }}-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            out/*.tar.xz
            out/*.tar.xz.sha256

  publish:
    needs: build
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls files
          tag="mac-servers-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" files/* --repo "${{ github.repository }}" \
            --title "Mac servers $(date -u +%Y-%m-%d)" \
            --notes "Built for macOS 12+ on Intel (x64) and Apple Silicon (arm64). Add to NexDB's catalog with: python scripts/macos-servers/catalog.py add <these files> https://github.com/${{ github.repository }}/releases/download/$tag"
